name: Generate Pac-Man Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *"   # Auto-runs every day at midnight (UTC)
  workflow_dispatch: {}    # Allows manual trigger via "Run workflow" in GitHub Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: sazzyrocks
          games: 'pacman'
          player_style: 'opportunistic'
          hide_month_labels: 'false'

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

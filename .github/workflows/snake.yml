name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # roz raat 12 baje (UTC) auto-run hoga
  workflow_dispatch: {}    # manually bhi "Run workflow" button se chala sakte ho
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: sazzyrocks
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#0ea5e9&color_dots=#ebedf0,#e9d5ff,#c084fc,#8b5cf6,#6d28d9
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161b22,#2d1557,#581c87,#8b5cf6,#c084fc

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg fill="none" viewBox="0 0 900 120" width="100%" height="120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .dot {
      fill: #3b82f6;
    }
    .sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .sub-blue {
      fill: #60a5fa;
    }
  </style>

  <!-- Clean dark background with subtle border -->
  <rect width="900" height="120" rx="10" fill="#080c14" stroke="#1e293b" stroke-width="1" />

  <!-- Simple, elegant typography -->
  <text class="name" x="450" y="62" text-anchor="middle">Sajal Porey<tspan class="dot">.</tspan></text>
  <text class="sub" x="450" y="90" text-anchor="middle">full-stack <tspan class="sub-blue">&amp;</tspan> machine learning developer</text>
</svg>

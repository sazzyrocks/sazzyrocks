<svg fill="none" viewBox="0 0 920 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0A0E18" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Ambient Lighting Gradients -->
    <radialGradient id="solar-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#EA580C" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#07090E" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyan-glow" cx="88%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#07090E" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Beam Divider -->
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0" />
      <stop offset="25%" stop-color="#F97316" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FED7AA" stop-opacity="1" />
      <stop offset="75%" stop-color="#F97316" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="arch-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.032" stroke-width="0.8" />
      <circle cx="0" cy="0" r="0.8" fill="#FFFFFF" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.95); }
    }
    @keyframes subtleDrift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1.5px); }
    }
    .pulse-dot { animation: pulseGlow 2.5s ease-in-out infinite; transform-origin: 752px 42px; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .hero-name { letter-spacing: 14px; font-weight: 800; }
    .hud-label { letter-spacing: 2px; }
    .tag-text { letter-spacing: 1.2px; }
  </style>

  <!-- Frame Background -->
  <rect width="920" height="260" rx="16" fill="url(#bg-grad)" stroke="#1F2937" stroke-width="1.2" />

  <!-- Background Technical Grid -->
  <rect width="920" height="260" rx="16" fill="url(#arch-grid)" />

  <!-- Atmospheric Glow Overlays -->
  <rect width="920" height="260" rx="16" fill="url(#solar-glow)" />
  <rect width="920" height="260" rx="16" fill="url(#cyan-glow)" />

  <!-- Corner Precision Crosshairs -->
  <path d="M 28 22 L 28 34 M 22 28 L 34 28" stroke="#F97316" stroke-width="1.2" stroke-opacity="0.75" />
  <path d="M 892 22 L 892 34 M 886 28 L 898 28" stroke="#F97316" stroke-width="1.2" stroke-opacity="0.75" />
  <path d="M 28 226 L 28 238 M 22 232 L 34 232" stroke="#4B5563" stroke-width="1.2" stroke-opacity="0.6" />
  <path d="M 892 226 L 892 238 M 886 232 L 898 232" stroke="#4B5563" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Top HUD Bar -->
  <g>
    <!-- Terminal Identifier -->
    <circle cx="52" cy="42" r="3.5" fill="#EF4444" opacity="0.85" />
    <circle cx="64" cy="42" r="3.5" fill="#EAB308" opacity="0.85" />
    <circle cx="76" cy="42" r="3.5" fill="#10B981" opacity="0.85" />
    <text class="mono hud-label" x="94" y="46" font-size="11" font-weight="600" fill="#94A3B8">SAZZYROCKS // SYS.ARCH: 2026</text>

    <!-- Center Coordinates -->
    <text class="mono" x="460" y="46" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle" letter-spacing="3">LAT 22.57° N · LON 88.36° E</text>

    <!-- Status Pill (Right) -->
    <rect x="736" y="30" width="140" height="24" rx="12" fill="#0D1527" stroke="#334155" stroke-width="1" />
    <circle class="pulse-dot" cx="752" cy="42" r="3.5" fill="#22C55E" />
    <text class="mono" x="763" y="46" font-size="9.5" font-weight="600" fill="#CBD5E1" letter-spacing="1">AVAILABLE FOR ROLES</text>
  </g>

  <!-- Top Separator Line -->
  <line x1="44" y1="64" x2="876" y2="64" stroke="#1E293B" stroke-width="1" />

  <!-- Main Hero Identity (Centered at 460) -->
  <g transform="translate(460, 0)">
    <!-- Pre-title Callout -->
    <text class="mono" x="0" y="96" font-size="11" font-weight="600" fill="#F97316" text-anchor="middle" letter-spacing="4">CREATIVE TECHNOLOGIST &amp; SYSTEMS ENGINEER</text>

    <!-- Core Name (Compensated for trailing letter-spacing) -->
    <text class="sans hero-name" x="-7" y="142" font-size="44" fill="url(#name-grad)" text-anchor="middle">SAJAL POREY</text>

    <!-- Precision Laser Beam Divider -->
    <line x1="-190" y1="160" x2="190" y2="160" stroke="url(#divider-grad)" stroke-width="1.6" />
    <!-- Center Dot Indicator -->
    <circle cx="0" cy="160" r="2.5" fill="#FED7AA" />

    <!-- Subtitle / Core Competencies -->
    <text class="sans" x="0" y="184" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="2.5">
      3D Spatial Web <tspan fill="#F97316">·</tspan> Distributed Systems Architecture <tspan fill="#F97316">·</tspan> Intelligent Agents
    </text>
  </g>

  <!-- Bottom HUD Specs Strip -->
  <g>
    <!-- Bottom Separator Line -->
    <line x1="44" y1="206" x2="876" y2="206" stroke="#1E293B" stroke-width="1" />

    <!-- Pill 1: Three.js -->
    <g transform="translate(48, 218)">
      <rect width="186" height="25" rx="6" fill="#0A1124" stroke="#1E293B" stroke-width="0.9" />
      <text class="mono tag-text" x="93" y="16.5" font-size="9" font-weight="600" fill="#FDBA74" text-anchor="middle">01 // THREE.JS &amp; WEBGL</text>
    </g>

    <!-- Pill 2: Algorithms -->
    <g transform="translate(254, 218)">
      <rect width="196" height="25" rx="6" fill="#0A1124" stroke="#1E293B" stroke-width="0.9" />
      <text class="mono tag-text" x="98" y="16.5" font-size="9" font-weight="600" fill="#E2E8F0" text-anchor="middle">02 // C++ &amp; ADVANCED DSA</text>
    </g>

    <!-- Pill 3: Full-Stack -->
    <g transform="translate(470, 218)">
      <rect width="196" height="25" rx="6" fill="#0A1124" stroke="#1E293B" stroke-width="0.9" />
      <text class="mono tag-text" x="98" y="16.5" font-size="9" font-weight="600" fill="#E2E8F0" text-anchor="middle">03 // REACT &amp; NODE SYSTEMS</text>
    </g>

    <!-- Pill 4: Agent Systems -->
    <g transform="translate(686, 218)">
      <rect width="186" height="25" rx="6" fill="#0A1124" stroke="#1E293B" stroke-width="0.9" />
      <text class="mono tag-text" x="93" y="16.5" font-size="9" font-weight="600" fill="#38BDF8" text-anchor="middle">04 // AUTONOMOUS AI AGENTS</text>
    </g>
  </g>
</svg>
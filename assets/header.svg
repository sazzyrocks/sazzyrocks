<svg fill="none" viewBox="0 0 850 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#080605" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="365" y1="0" x2="485" y2="0">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.9; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .tw { animation: twinkle 4s ease-in-out infinite; }
    .glow { animation: breathe 6s ease-in-out infinite; }
    .name { animation: fadeUp 1.2s ease-out both; }
    .role { animation: fadeUp 1.2s ease-out 0.4s both; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Base -->
  <rect width="850" height="220" rx="16" fill="url(#bg)" stroke="#1c1917" stroke-width="1" />

